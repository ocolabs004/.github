name: 버그 신고
description: 동작하지 않거나 잘못 동작하는 것을 알립니다.
labels: ["버그"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나
      description: 관찰한 증상. 에러 메시지가 있으면 그대로 붙여주세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 환경
      description: 브랜치·배포 환경·브라우저·기기 등 관련된 것만.
      placeholder: staging / Chrome 130 / iPhone 15
